name: sova

services:
  postgres:
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-sova}
      POSTGRES_USER: ${DATABASE_USER:-sova}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-sova_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - sova-internal

  sova-api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-sova}
      DATABASE_USER: ${DATABASE_USER:-sova}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-sova_local_password}
      SOVA_HTTP_HOST: 0.0.0.0
      SOVA_HTTP_PORT: 8080
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-AC00000000000000000000000000000000}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-local_test_auth_token}
      TWILIO_WHATSAPP_SENDER: ${TWILIO_WHATSAPP_SENDER:-whatsapp:+15550000000}
      SOVA_HOUSEHOLD_NAME: ${SOVA_HOUSEHOLD_NAME:-Sova Household}
      SOVA_USER_A_NAME: ${SOVA_USER_A_NAME:-User A}
      SOVA_USER_A_WHATSAPP: ${SOVA_USER_A_WHATSAPP:-whatsapp:+15550000001}
      SOVA_USER_B_NAME: ${SOVA_USER_B_NAME:-User B}
      SOVA_USER_B_WHATSAPP: ${SOVA_USER_B_WHATSAPP:-whatsapp:+15550000002}
      AI_PROVIDER: gemini
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-sova-local}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/google_service_account}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_AUDIO_MODEL: ${GEMINI_AUDIO_MODEL:-gemini-3.5-flash-lite}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.5-flash-lite}
      MAX_TOOL_ITERATIONS: ${MAX_TOOL_ITERATIONS:-5}
      SOVA_MAX_PROJECTION_MONTHS: ${SOVA_MAX_PROJECTION_MONTHS:-24}
      SOVA_MAX_AUDIO_BYTES: ${SOVA_MAX_AUDIO_BYTES:-16777216}
      SOVA_MAX_AUDIO_DURATION_MINUTES: ${SOVA_MAX_AUDIO_DURATION_MINUTES:-5}
      SOVA_AUDIO_MAX_ATTEMPTS: ${SOVA_AUDIO_MAX_ATTEMPTS:-3}
      SOVA_MAX_IMAGE_BYTES: ${SOVA_MAX_IMAGE_BYTES:-10485760}
      SOVA_IMAGE_MAX_ATTEMPTS: ${SOVA_IMAGE_MAX_ATTEMPTS:-3}
      SOVA_IMAGE_MIN_CONFIDENCE: ${SOVA_IMAGE_MIN_CONFIDENCE:-0.85}
      SOVA_MEDIA_STORAGE_PATH: /var/lib/sova/attachments
      SOVA_PUBLIC_BASE_URL: ${SOVA_ADDRESS:-http://localhost}
      SOVA_USER_A_DASHBOARD_PASSWORD: ${SOVA_USER_A_DASHBOARD_PASSWORD:-}
      SOVA_USER_B_DASHBOARD_PASSWORD: ${SOVA_USER_B_DASHBOARD_PASSWORD:-}
      SOVA_DASHBOARD_SESSION_KEY: ${SOVA_DASHBOARD_SESSION_KEY:-}
      SOVA_DASHBOARD_SESSION_HOURS: ${SOVA_DASHBOARD_SESSION_HOURS:-24}
    volumes:
      - sova_media:/var/lib/sova/attachments
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/sova-api.jar", "com.sova.HealthCheckKt"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - sova-internal

  sova-web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      sova-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - sova-internal

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      SOVA_ADDRESS: ${SOVA_ADDRESS:-http://localhost}
    ports:
      - "${SOVA_HTTP_PORT:-8080}:80"
      - "${SOVA_HTTPS_PORT:-8443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      sova-api:
        condition: service_healthy
      sova-web:
        condition: service_healthy
    networks:
      - sova-internal

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  sova_media:

networks:
  sova-internal:
    driver: bridge
