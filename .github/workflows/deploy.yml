name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
      DEPLOY_ROOT: ${{ secrets.VPS_DEPLOY_PATH || '/opt/sova' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/sova_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/sova_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/sova_deploy" > /dev/null

      - name: Package the approved source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='backend/build' \
            -czf "$RUNNER_TEMP/sova-release.tar.gz" .

      - name: Upload and activate the release
        shell: bash
        run: |
          set -euo pipefail
          release_id="${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_archive="/tmp/sova-${release_id}.tar.gz"
          ssh_options=(
            -i "$HOME/.ssh/sova_deploy"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
          )

          scp \
            -i "$HOME/.ssh/sova_deploy" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$RUNNER_TEMP/sova-release.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"

          # Values expanded locally below are constrained by the validation step.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- '$DEPLOY_ROOT' '$release_id' '$remote_archive'" <<'REMOTE_SCRIPT'
          set -euo pipefail

          deploy_root="$1"
          release_id="$2"
          remote_archive="$3"
          release_path="${deploy_root}/releases/${release_id}"
          shared_env="${deploy_root}/shared/.env"

          test -f "$shared_env" || {
            echo "Missing production configuration: $shared_env" >&2
            exit 1
          }
          test ! -e "$release_path" || {
            echo "Release already exists: $release_path" >&2
            exit 1
          }

          mkdir -p "${deploy_root}/releases"
          mkdir "$release_path"
          tar -xzf "$remote_archive" -C "$release_path"
          rm -f "$remote_archive"
          ln -s "$shared_env" "${release_path}/.env"

          cd "$release_path"
          docker compose config --quiet
          docker compose up --detach --build --remove-orphans --wait
          docker compose ps

          next_link="${deploy_root}/.current-${release_id}"
          ln -s "$release_path" "$next_link"
          mv -Tf "$next_link" "${deploy_root}/current"
          REMOTE_SCRIPT
