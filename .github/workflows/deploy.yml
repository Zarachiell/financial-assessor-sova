name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
      DEPLOY_ROOT: ${{ secrets.VPS_DEPLOY_PATH || '/opt/sova' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/sova_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/sova_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/sova_deploy" > /dev/null

      - name: Package the approved source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='backend/build' \
            -czf "$RUNNER_TEMP/sova-release.tar.gz" .

      - name: Render production configuration
        shell: bash
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          SOVA_HTTP_PORT: ${{ secrets.SOVA_HTTP_PORT }}
          SOVA_HTTPS_PORT: ${{ secrets.SOVA_HTTPS_PORT }}
          SOVA_ADDRESS: ${{ secrets.SOVA_ADDRESS }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_SENDER: ${{ secrets.TWILIO_WHATSAPP_SENDER }}
          SOVA_HOUSEHOLD_NAME: ${{ secrets.SOVA_HOUSEHOLD_NAME }}
          SOVA_USER_A_NAME: ${{ secrets.SOVA_USER_A_NAME }}
          SOVA_USER_A_WHATSAPP: ${{ secrets.SOVA_USER_A_WHATSAPP }}
          SOVA_USER_B_NAME: ${{ secrets.SOVA_USER_B_NAME }}
          SOVA_USER_B_WHATSAPP: ${{ secrets.SOVA_USER_B_WHATSAPP }}
          SOVA_USER_A_DASHBOARD_PASSWORD: ${{ secrets.SOVA_USER_A_DASHBOARD_PASSWORD }}
          SOVA_USER_B_DASHBOARD_PASSWORD: ${{ secrets.SOVA_USER_B_DASHBOARD_PASSWORD }}
          SOVA_DASHBOARD_SESSION_KEY: ${{ secrets.SOVA_DASHBOARD_SESSION_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT || 'sova-506801' }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'global' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_AUDIO_MODEL: ${{ vars.GEMINI_AUDIO_MODEL || 'gemini-3.5-flash-lite' }}
          MAX_TOOL_ITERATIONS: ${{ vars.MAX_TOOL_ITERATIONS || '5' }}
          SOVA_MAX_PROJECTION_MONTHS: ${{ vars.SOVA_MAX_PROJECTION_MONTHS || '24' }}
          SOVA_MAX_AUDIO_BYTES: ${{ vars.SOVA_MAX_AUDIO_BYTES || '16777216' }}
          SOVA_MAX_AUDIO_DURATION_MINUTES: ${{ vars.SOVA_MAX_AUDIO_DURATION_MINUTES || '5' }}
          SOVA_AUDIO_MAX_ATTEMPTS: ${{ vars.SOVA_AUDIO_MAX_ATTEMPTS || '3' }}
        run: |
          set -euo pipefail
          umask 077
          output="$RUNNER_TEMP/sova-production.env"
          : > "$output"

          write_secret() {
            local name="$1"
            local value="${!name}"
            test -n "$value"
            [[ "$value" != *$'\n'* ]]
            [[ "$value" != *$'\r'* ]]
            value="${value//\\/\\\\}"
            value="${value//\'/\\\'}"
            printf "%s='%s'\n" "$name" "$value" >> "$output"
          }

          required_secrets=(
            DATABASE_NAME
            DATABASE_USER
            DATABASE_PASSWORD
            SOVA_HTTP_PORT
            SOVA_HTTPS_PORT
            SOVA_ADDRESS
            TWILIO_ACCOUNT_SID
            TWILIO_AUTH_TOKEN
            TWILIO_WHATSAPP_SENDER
            SOVA_HOUSEHOLD_NAME
            SOVA_USER_A_NAME
            SOVA_USER_A_WHATSAPP
            SOVA_USER_B_NAME
            SOVA_USER_B_WHATSAPP
            SOVA_USER_A_DASHBOARD_PASSWORD
            SOVA_USER_B_DASHBOARD_PASSWORD
            SOVA_DASHBOARD_SESSION_KEY
            AI_PROVIDER
            GOOGLE_CLOUD_PROJECT
            GOOGLE_CLOUD_LOCATION
            GEMINI_MODEL
            GEMINI_AUDIO_MODEL
            MAX_TOOL_ITERATIONS
            SOVA_MAX_PROJECTION_MONTHS
            SOVA_MAX_AUDIO_BYTES
            SOVA_MAX_AUDIO_DURATION_MINUTES
            SOVA_AUDIO_MAX_ATTEMPTS
          )

          for secret_name in "${required_secrets[@]}"; do
            write_secret "$secret_name"
          done

      - name: Upload and activate the release
        shell: bash
        run: |
          set -euo pipefail
          release_id="${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_archive="/tmp/sova-${release_id}.tar.gz"
          remote_env="/tmp/sova-env-${release_id}"
          ssh_options=(
            -i "$HOME/.ssh/sova_deploy"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
          )

          scp \
            -i "$HOME/.ssh/sova_deploy" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$RUNNER_TEMP/sova-release.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"

          scp \
            -i "$HOME/.ssh/sova_deploy" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$RUNNER_TEMP/sova-production.env" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_env}"

          # Values expanded locally below are constrained by the validation step.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- '$DEPLOY_ROOT' '$release_id' '$remote_archive' '$remote_env'" <<'REMOTE_SCRIPT'
          set -euo pipefail

          deploy_root="$1"
          release_id="$2"
          remote_archive="$3"
          remote_env="$4"
          release_path="${deploy_root}/releases/${release_id}"
          shared_env="${deploy_root}/shared/.env"
          google_credentials="${deploy_root}/secrets/google-service-account.json"
          next_env="${shared_env}.next-${release_id}"
          compose_files=(-f docker-compose.yml -f docker-compose.production.yml)

          cleanup() {
            status="$?"
            trap - EXIT
            if [ "$status" -ne 0 ] && [ -f "${release_path}/docker-compose.yml" ]; then
              echo "Deployment failed; collecting sova-api diagnostics" >&2
              (
                cd "$release_path"
                docker compose "${compose_files[@]}" ps || true
                docker compose "${compose_files[@]}" logs --no-color --tail=120 sova-api || true
              )
            fi
            rm -f "$remote_archive" "$remote_env" "$next_env"
            exit "$status"
          }
          trap cleanup EXIT

          test ! -e "$release_path" || {
            echo "Release already exists: $release_path" >&2
            exit 1
          }

          mkdir -p "${deploy_root}/releases" "${deploy_root}/shared"
          test -f "$google_credentials" || {
            echo "Missing Google credentials file: $google_credentials" >&2
            exit 1
          }
          credential_mode_text="$(stat -c '%a' "$google_credentials")"
          case "$credential_mode_text" in
            640|440) ;;
            *)
              echo "Google credentials must use mode 0640 or 0440" >&2
              exit 1
              ;;
          esac
          GOOGLE_SERVICE_ACCOUNT_GID="$(stat -c '%g' "$google_credentials")"
          [[ "$GOOGLE_SERVICE_ACCOUNT_GID" =~ ^[0-9]+$ ]]
          export GOOGLE_SERVICE_ACCOUNT_GID
          install -m 600 "$remote_env" "$next_env"
          mv -f "$next_env" "$shared_env"
          mkdir "$release_path"
          tar -xzf "$remote_archive" -C "$release_path"
          ln -s "$shared_env" "${release_path}/.env"

          cd "$release_path"
          docker compose "${compose_files[@]}" config --quiet
          docker compose "${compose_files[@]}" build sova-api
          docker compose "${compose_files[@]}" run \
            --rm \
            --no-deps \
            --no-TTY \
            --entrypoint sh \
            -e EXPECTED_GOOGLE_SERVICE_ACCOUNT_GID="$GOOGLE_SERVICE_ACCOUNT_GID" \
            sova-api -ec '
            test "$(id -u)" = "10001"
            test "$(id -g)" = "10001"
            id -G | tr " " "\n" | grep -Fx "$EXPECTED_GOOGLE_SERVICE_ACCOUNT_GID" >/dev/null
            test -r /run/secrets/google_service_account
            printf "Sova runtime identity: uid=%s gid=%s supplementary_gids=%s; Google credentials: OK\n" \
              "$(id -u)" "$(id -g)" "$(id -G)"
          ' </dev/null
          docker compose "${compose_files[@]}" up --detach --build --remove-orphans --wait </dev/null

          running_container_id="$(docker compose "${compose_files[@]}" ps --quiet sova-api)"
          test -n "$running_container_id"
          running_image_id="$(docker inspect --format '{{.Image}}' "$running_container_id")"
          built_image_id="$(docker image inspect sova-sova-api:latest --format '{{.Id}}')"
          test "$running_image_id" = "$built_image_id" || {
            echo "Running sova-api container does not use the image built for this release" >&2
            exit 1
          }
          docker compose "${compose_files[@]}" exec --no-TTY sova-api sh -ec '
            test "$(id -u)" = "10001"
            test "$(id -g)" = "10001"
            test "$AI_PROVIDER" = "gemini"
            test "$GOOGLE_APPLICATION_CREDENTIALS" = "/run/secrets/google_service_account"
            test -r "$GOOGLE_APPLICATION_CREDENTIALS"
            printf "Sova production provider: %s; model: %s\n" \
              "$AI_PROVIDER" "$GEMINI_MODEL"
          ' </dev/null
          docker compose "${compose_files[@]}" ps

          next_link="${deploy_root}/.current-${release_id}"
          ln -s "$release_path" "$next_link"
          mv -Tf "$next_link" "${deploy_root}/current"
          REMOTE_SCRIPT
